
name: Build SWIN OXIDE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP" -d extracted

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME"

      - name: Build APK
        run: |
          cd extracted/SwinOxideMenu-Standalone
          "$HOME/gradle-8.9/bin/gradle" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swin-oxide-apk
          path: extracted/SwinOxideMenu-Standalone/app/build/outputs/apk/debug/app-debug.APK
